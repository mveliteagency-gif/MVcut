<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Stylized MV Monogram with Blade & Film -->
  <g transform="translate(64, 50)">
    <!-- M Letter (Cyan) -->
    <path d="M 60 260 L 60 70 L 140 180 L 220 70 L 220 260" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- V Letter with cutting blade angle (Violet) -->
    <path d="M 230 110 L 290 260 L 350 70" fill="none" stroke="url(#violetGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Film Perforations loop -->
    <path d="M 40 160 Q 140 80 240 140 Q 320 190 350 140" fill="none" stroke="#00f2fe" stroke-width="8" stroke-dasharray="12,8" opacity="0.8"/>

    <!-- App Name -->
    <text x="190" y="340" font-family="'Outfit', 'Inter', sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      MVCUT
    </text>
  </g>
</svg>
